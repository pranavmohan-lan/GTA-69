<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Coast — Open World</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#070b12;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff}
#status{position:absolute;left:22px;top:20px;width:260px;padding:15px 17px;border-radius:15px;background:rgba(5,8,13,.62);backdrop-filter:blur(12px);box-shadow:0 10px 35px #0008}
#status .money{font-size:26px;font-weight:800;color:#62ff7c;margin:4px 0 9px}
#status .time{font-size:22px;font-weight:800}
.label{font-size:11px;letter-spacing:1.5px;color:#b9c1cb}
.bar{height:9px;background:#252b34;border-radius:20px;overflow:hidden;margin:4px 0 10px}
#health{height:100%;width:100%;background:linear-gradient(90deg,#ff3d45,#ff9b3d,#48ef71)}
#wanted{letter-spacing:4px;color:#ffd32a;font-size:18px}
#mission{position:absolute;left:50%;top:20px;transform:translateX(-50%);min-width:380px;max-width:650px;text-align:center;padding:13px 20px;border-radius:14px;background:rgba(5,8,13,.64);backdrop-filter:blur(12px);font-size:14px}
#vehicle{position:absolute;right:20px;top:20px;padding:13px 16px;min-width:190px;border-radius:14px;background:rgba(5,8,13,.62);backdrop-filter:blur(12px)}
#vehicleName{font-size:16px;font-weight:800;margin-top:3px}
#speed{font-size:30px;font-weight:900}
#hint{position:absolute;left:22px;bottom:20px;padding:11px 14px;line-height:1.65;font-size:12px;border-radius:12px;background:#05080db3}
#minimap{position:absolute;right:20px;bottom:20px;width:210px;height:210px;border:3px solid #fff;border-radius:50%;overflow:hidden;background:#151b22;box-shadow:0 8px 30px #0008}
#map{width:100%;height:100%}
#message{position:absolute;left:50%;bottom:135px;transform:translateX(-50%);padding:12px 20px;border-radius:12px;background:#05080dd9;opacity:0;transition:.25s;font-weight:700}
#crosshair{position:absolute;left:50%;top:50%;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.8;transform:translate(-50%,-50%)}
#start{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 42%,#563a59 0,#151923 42%,#05070b 100%);color:#fff}
.startbox{width:min(650px,92%);padding:46px;text-align:center;border:1px solid #ffffff24;border-radius:24px;background:#05080dbb;backdrop-filter:blur(16px);box-shadow:0 30px 100px #000}
.startbox h1{font-size:56px;letter-spacing:6px;margin-bottom:8px;text-shadow:0 5px 30px #ff4fc055}
.startbox p{color:#bfc6d0;margin-bottom:25px}
#startBtn{pointer-events:auto;border:0;border-radius:12px;padding:15px 38px;font-size:16px;font-weight:800;cursor:pointer}
.small{font-size:11px;color:#7f8996;margin-top:18px}
</style>
</head>
<body>

<div id="start">
  <div class="startbox">
    <h1>NEON COAST</h1>
    <p>Original procedural open-world driving prototype</p>
    <button id="startBtn">ENTER WORLD</button>
    <div class="small">Large seamless city • pedestrians • traffic • missions • day/night</div>
  </div>
</div>

<div id="hud">
  <div id="status">
    <div class="label">CASH</div>
    <div class="money" id="money">$5,000</div>
    <div class="label">HEALTH</div>
    <div class="bar"><div id="health"></div></div>
    <div class="label">WANTED</div>
    <div id="wanted">☆☆☆☆☆</div>
    <div class="time" id="clock">18:40</div>
  </div>

  <div id="mission">MISSION: Drive to the blue destination</div>

  <div id="vehicle">
    <div class="label">VEHICLE</div>
    <div id="vehicleName">ON FOOT</div>
    <div id="speed">0 km/h</div>
  </div>

  <div id="hint">
    <b>WASD</b> move/drive &nbsp; <b>E</b> enter/exit<br>
    <b>SHIFT</b> sprint &nbsp; <b>SPACE</b> brake &nbsp; <b>M</b> map
  </div>

  <div id="message"></div>
  <div id="crosshair"></div>

  <div id="minimap"><canvas id="map" width="210" height="210"></canvas></div>
</div>

<script type="importmap">
{
  "imports": {
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

/* -------------------- renderer / scene -------------------- */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x182033);
scene.fog=new THREE.FogExp2(0x182033,0.00085);

const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,2200);
camera.position.set(0,7,12);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);

/* -------------------- lighting -------------------- */
const hemi=new THREE.HemisphereLight(0xffd9cf,0x101722,1.5);
scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd1b0,3.0);
sun.position.set(-300,420,-220);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-700; sun.shadow.camera.right=700;
sun.shadow.camera.top=700; sun.shadow.camera.bottom=-700;
scene.add(sun);

const moon=new THREE.DirectionalLight(0x718dff,0.0);
moon.position.set(200,350,100);
scene.add(moon);

/* -------------------- materials -------------------- */
const roadMat=new THREE.MeshStandardMaterial({color:0x20252c,roughness:.92});
const sidewalkMat=new THREE.MeshStandardMaterial({color:0x70767d,roughness:.92});
const grassMat=new THREE.MeshStandardMaterial({color:0x314c3a,roughness:1});
const waterMat=new THREE.MeshPhysicalMaterial({color:0x0d526e,roughness:.18,metalness:.15,transmission:.05});
const whiteLine=new THREE.MeshBasicMaterial({color:0xf4e8b7});
const yellowLine=new THREE.MeshBasicMaterial({color:0xffd45a});
const glassMat=new THREE.MeshPhysicalMaterial({color:0x172532,metalness:.25,roughness:.12,transmission:.08,transparent:true,opacity:.92});

/* -------------------- large seamless world -------------------- */
const WORLD=1800, ROAD=24, BLOCK=120;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(WORLD,WORLD),grassMat);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

/* coast / water */
const water=new THREE.Mesh(new THREE.PlaneGeometry(420,WORLD),waterMat);
water.rotation.x=-Math.PI/2; water.position.set(760,-.08,0); scene.add(water);

/* roads */
const roadXs=[], roadZs=[];
for(let p=-840;p<=840;p+=BLOCK){roadXs.push(p);roadZs.push(p)}
for(const x of roadXs){
  const r=new THREE.Mesh(new THREE.BoxGeometry(ROAD,.08,WORLD),roadMat);
  r.position.set(x,.04,0); r.receiveShadow=true; scene.add(r);
  const s1=new THREE.Mesh(new THREE.BoxGeometry(3,.13,WORLD),sidewalkMat);
  s1.position.set(x-ROAD/2-1.5,.09,0); scene.add(s1);
  const s2=s1.clone(); s2.position.x=x+ROAD/2+1.5; scene.add(s2);
}
for(const z of roadZs){
  const r=new THREE.Mesh(new THREE.BoxGeometry(WORLD,.08,ROAD),roadMat);
  r.position.set(0,.04,z); r.receiveShadow=true; scene.add(r);
  const s1=new THREE.Mesh(new THREE.BoxGeometry(WORLD,.13,3),sidewalkMat);
  s1.position.set(0,.09,z-ROAD/2-1.5); scene.add(s1);
  const s2=s1.clone(); s2.position.z=z+ROAD/2+1.5; scene.add(s2);
}
/* lane dashes */
for(const x of roadXs){
  for(let z=-870;z<870;z+=18){
    const d=new THREE.Mesh(new THREE.BoxGeometry(.3,.11,8),whiteLine);
    d.position.set(x,.105,z); scene.add(d);
  }
}
for(const z of roadZs){
  for(let x=-870;x<870;x+=18){
    const d=new THREE.Mesh(new THREE.BoxGeometry(8,.11,.3),whiteLine);
    d.position.set(x,.105,z); scene.add(d);
  }
}

/* -------------------- buildings -------------------- */
const buildings=[];
const buildingColors=[0x7d7772,0x626b74,0x817c72,0x58666b,0x726b80,0x8a8176];

function makeBuilding(x,z,w,d,h){
  const m=new THREE.MeshStandardMaterial({
    color:buildingColors[(Math.random()*buildingColors.length)|0],
    roughness:.78,metalness:.05
  });
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
  b.position.set(x,h/2,z); b.castShadow=true;b.receiveShadow=true;scene.add(b);
  buildings.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});

  /* glass facade */
  if(Math.random()<.72){
    const side=Math.random()<.5;
    const cols=Math.max(2,Math.floor((side?w:d)/5));
    const rows=Math.max(2,Math.floor(h/5));
    for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
      const ww=side?.7:.07, dd=side?.07:.7;
      const win=new THREE.Mesh(new THREE.BoxGeometry(ww,.8,dd),glassMat);
      const px=side ? x-w/2-.04 : x-w/2+(i+.5)*(w/cols);
      const pz=side ? z-d/2+(i+.5)*(d/cols) : z-d/2-.04;
      win.position.set(px,3+j*5,pz);
      if(side) win.rotation.y=Math.PI/2;
      scene.add(win);
    }
  }
}
for(let bx=-840;bx<840;bx+=BLOCK){
  for(let bz=-840;bz<840;bz+=BLOCK){
    if(Math.random()<.12) continue;
    const x=bx+BLOCK/2+(Math.random()-.5)*18;
    const z=bz+BLOCK/2+(Math.random()-.5)*18;
    const w=50+Math.random()*42, d=50+Math.random()*42;
    const h=12+Math.random()*110;
    if(x>600) continue;
    makeBuilding(x,z,w,d,h);
  }
}

/* -------------------- palms / street lights -------------------- */
function palm(x,z,scale=1){
  const g=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.22*scale,.35*scale,6*scale,8),new THREE.MeshStandardMaterial({color:0x785438,roughness:1}));
  trunk.position.y=3*scale; trunk.rotation.z=(Math.random()-.5)*.08; trunk.castShadow=true;g.add(trunk);
  const leafMat=new THREE.MeshStandardMaterial({color:0x1e6d45,roughness:.85});
  for(let i=0;i<7;i++){
    const leaf=new THREE.Mesh(new THREE.ConeGeometry(.13*scale,3.5*scale,7),leafMat);
    leaf.position.y=6*scale; leaf.rotation.z=Math.PI/2.4; leaf.rotation.y=i*Math.PI*2/7; g.add(leaf);
  }
  g.position.set(x,0,z);scene.add(g);
}
for(let i=0;i<150;i++){
  const x=(Math.random()-.5)*1500, z=(Math.random()-.5)*1500;
  if(Math.abs(x%BLOCK)<18||Math.abs(z%BLOCK)<18) continue;
  palm(x,z,.8+Math.random()*.65);
}
function streetLight(x,z){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(.06,.09,6,8),new THREE.MeshStandardMaterial({color:0x25282c,metalness:.7,roughness:.3}));
  pole.position.set(x,3,z);scene.add(pole);
  const bulb=new THREE.Mesh(new THREE.SphereGeometry(.18,8,8),new THREE.MeshBasicMaterial({color:0xffdca0}));
  bulb.position.set(x,6,z);scene.add(bulb);
  const light=new THREE.PointLight(0xffbd75,0,22,2);light.position.set(x,5.8,z);scene.add(light);
  return light;
}
const streetLights=[];
for(let x=-840;x<=840;x+=120) for(let z=-840;z<=840;z+=120){
  streetLights.push(streetLight(x+14,z+14));
}

/* -------------------- human character -------------------- */
function makeHuman(shirt=0x2f5f9a,pants=0x252934,skin=0xb77b58){
  const g=new THREE.Group();
  const skinMat=new THREE.MeshStandardMaterial({color:skin,roughness:.8});
  const shirtMat=new THREE.MeshStandardMaterial({color:shirt,roughness:.75});
  const pantsMat=new THREE.MeshStandardMaterial({color:pants,roughness:.9});
  const shoeMat=new THREE.MeshStandardMaterial({color:0x17191d,roughness:.8});

  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.38,.85,5,10),shirtMat);
  torso.position.y=1.15; torso.castShadow=true;g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(.29,16,12),skinMat);
  head.position.y=2.12;head.castShadow=true;g.add(head);

  const armGeo=new THREE.CapsuleGeometry(.11,.62,4,8);
  const legGeo=new THREE.CapsuleGeometry(.13,.72,4,8);
  for(const s of [-1,1]){
    const arm=new THREE.Mesh(armGeo,shirtMat);arm.position.set(s*.48,1.2,0);arm.rotation.z=s*.12;arm.castShadow=true;g.add(arm);
    const leg=new THREE.Mesh(legGeo,pantsMat);leg.position.set(s*.18,.48,0);leg.castShadow=true;g.add(leg);
    const shoe=new THREE.Mesh(new THREE.BoxGeometry(.25,.13,.5),shoeMat);shoe.position.set(s*.18,.08,-.1);shoe.castShadow=true;g.add(shoe);
  }
  return g;
}

const player=makeHuman(0x151b23,0x26303b,0xc58a65);
player.position.set(0,0,30);scene.add(player);

/* pedestrians */
const pedestrians=[];
for(let i=0;i<75;i++){
  const colors=[0xd94c4c,0x3c72c4,0xe2a33d,0x6b9b63,0x8e5cc1,0xd7d7d7];
  const p=makeHuman(colors[(Math.random()*colors.length)|0],0x242831,0x9d674f+((Math.random()*3)|0)*0x111111);
  let x,z;
  if(Math.random()<.5){x=roadXs[(Math.random()*roadXs.length)|0]+(Math.random()<.5?-20:20);z=(Math.random()-.5)*1600}
  else {z=roadZs[(Math.random()*roadZs.length)|0]+(Math.random()<.5?-20:20);x=(Math.random()-.5)*1600}
  p.position.set(x,0,z);p.scale.setScalar(.82+Math.random()*.18);scene.add(p);
  pedestrians.push({mesh:p,dir:Math.random()*Math.PI*2,speed:.4+Math.random()*.8});
}

/* -------------------- realistic-ish original cars -------------------- */
const cars=[], traffic=[];
function createCar(x,z,color=0xb91f2a,isTraffic=false,name="Apex R"){
  const g=new THREE.Group();
  const bodyMat=new THREE.MeshPhysicalMaterial({color,metalness:.78,roughness:.2,clearcoat:1,clearcoatRoughness:.08});
  const dark=new THREE.MeshStandardMaterial({color:0x090b0f,metalness:.55,roughness:.28});
  const chrome=new THREE.MeshStandardMaterial({color:0xc7cbd0,metalness:.9,roughness:.18});

  const lower=new THREE.Mesh(new THREE.BoxGeometry(2.25,.58,4.7),bodyMat);
  lower.position.y=.72;lower.castShadow=true;g.add(lower);
  const hood=new THREE.Mesh(new THREE.BoxGeometry(2.12,.24,1.35),bodyMat);
  hood.position.set(0,1.03,-1.42);hood.castShadow=true;g.add(hood);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.72,.72,2.05),glassMat);
  roof.position.set(0,1.34,.15);roof.castShadow=true;g.add(roof);
  const spoiler=new THREE.Mesh(new THREE.BoxGeometry(1.8,.12,.55),bodyMat);
  spoiler.position.set(0,1.25,2.0);g.add(spoiler);

  for(const px of [-.78,.78]){
    const head=new THREE.Mesh(new THREE.BoxGeometry(.42,.18,.07),new THREE.MeshBasicMaterial({color:0xffffd7}));
    head.position.set(px,.82,-2.38);g.add(head);
    const tail=new THREE.Mesh(new THREE.BoxGeometry(.42,.18,.07),new THREE.MeshBasicMaterial({color:0xff1520}));
    tail.position.set(px,.82,2.38);g.add(tail);
  }

  const wheelMat=new THREE.MeshStandardMaterial({color:0x08090b,roughness:.78});
  for(const p of [[-1.12,.48,-1.48],[1.12,.48,-1.48],[-1.12,.48,1.48],[1.12,.48,1.48]]){
    const tire=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.3,20),wheelMat);
    tire.rotation.z=Math.PI/2;tire.position.set(...p);tire.castShadow=true;g.add(tire);
    const rim=new THREE.Mesh(new THREE.CylinderGeometry(.22,.22,.31,16),chrome);
    rim.rotation.z=Math.PI/2;rim.position.set(...p);g.add(rim);
  }
  g.position.set(x,.03,z);scene.add(g);
  const data={mesh:g,speed:0,angle:0,isTraffic,name,crashed:false};
  cars.push(data);return data;
}

const playerCar=createCar(0,52,0xe11d2e,false,"Apex R");
const secondCar=createCar(65,0,0x11151b,false,"Vortex S");

/* traffic follows straight road lanes */
for(let i=0;i<36;i++){
  const horizontal=Math.random()<.5;
  const road=roadXs[(Math.random()*roadXs.length)|0];
  let x,z,angle;
  if(horizontal){
    z=road+(Math.random()<.5?-5:5);x=-850+Math.random()*1700;
    angle=Math.random()<.5?Math.PI/2:-Math.PI/2;
  }else{
    x=road+(Math.random()<.5?-5:5);z=-850+Math.random()*1700;
    angle=Math.random()<.5?0:Math.PI;
  }
  const t=createCar(x,z,[0x1e4e87,0xe6e1d7,0x202328,0xc38b32,0x38765b,0x792c55][(Math.random()*6)|0],true,"City Sedan");
  t.angle=angle;t.mesh.rotation.y=angle;t.speed=7+Math.random()*7;traffic.push(t);
}

/* -------------------- mission system -------------------- */
const missions=[
 {x:360,z:240,text:"Drive to the marina destination",reward:400},
 {x:-480,z:-360,text:"Cross the downtown district",reward:700},
 {x:180,z:-720,text:"Reach the neon boulevard",reward:1000},
 {x:0,z:30,text:"Return to your home marker",reward:1600}
];
let missionIndex=0;
const marker=new THREE.Mesh(
  new THREE.CylinderGeometry(5,5,.25,40),
  new THREE.MeshBasicMaterial({color:0x159cff,transparent:true,opacity:.78})
);
scene.add(marker);
function loadMission(){
  const m=missions[missionIndex];marker.position.set(m.x,.18,m.z);
  document.getElementById("mission").textContent=`MISSION ${missionIndex+1}: ${m.text} • $${m.reward}`;
}
loadMission();

/* -------------------- input / movement -------------------- */
const keys={};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(e.code==="KeyE") interact();
  if(e.code==="KeyM"){
    const mm=document.getElementById("minimap");
    mm.style.display=mm.style.display==="none"?"block":"none";
  }
});
addEventListener("keyup",e=>keys[e.code]=false);

let yaw=0,pitch=.25,mouse=false;
renderer.domElement.addEventListener("mousedown",()=>mouse=true);
addEventListener("mouseup",()=>mouse=false);
addEventListener("mousemove",e=>{
  if(!mouse)return;
  yaw-=e.movementX*.0027;
  pitch-=e.movementY*.002;
  pitch=Math.max(-.2,Math.min(.85,pitch));
});

/* -------------------- collisions -------------------- */
function buildingCollision(pos,r=.8){
  for(const b of buildings){
    if(pos.x>b.minX-r&&pos.x<b.maxX+r&&pos.z>b.minZ-r&&pos.z<b.maxZ+r)return true;
  }
  return false;
}
function carCollision(pos,ignore,r=2.8){
  for(const c of cars){
    if(c===ignore)continue;
    if(c.mesh.position.distanceTo(pos)<r)return true;
  }
  return false;
}

let driving=false,currentVehicle=null;
function interact(){
  if(driving){
    player.visible=true;
    player.position.copy(currentVehicle.mesh.position);
    player.position.x+=3;
    driving=false;currentVehicle=null;
    document.getElementById("vehicleName").textContent="ON FOOT";
    show("Exited vehicle");
    return;
  }
  let best=null,bd=5;
  for(const c of cars.filter(c=>!c.isTraffic)){
    const d=player.position.distanceTo(c.mesh.position);
    if(d<bd){bd=d;best=c}
  }
  if(best){
    driving=true;currentVehicle=best;player.visible=false;
    show("Vehicle entered");
  }
}

function updatePlayer(dt){
  if(driving)return;
  let f=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  let s=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  if(!f&&!s)return;
  const v=new THREE.Vector3(
    Math.sin(yaw)*f+Math.cos(yaw)*s,0,
    Math.cos(yaw)*f-Math.sin(yaw)*s
  ).normalize();
  const speed=(keys.ShiftLeft||keys.ShiftRight)?10:5.5;
  const next=player.position.clone().addScaledVector(v,speed*dt);
  if(!buildingCollision(next)&&Math.abs(next.x)<880&&Math.abs(next.z)<880)player.position.copy(next);
  player.rotation.y=Math.atan2(v.x,v.z);
}

function updateCar(dt){
  if(!driving)return;
  const c=currentVehicle;
  const throttle=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  c.speed+=throttle*24*dt;
  c.speed*=Math.pow(.986,dt*60);
  c.speed=THREE.MathUtils.clamp(c.speed,-11,32);
  if(keys.Space)c.speed*=Math.pow(.90,dt*60);
  const steer=(keys.KeyA?1:0)-(keys.KeyD?1:0);
  c.angle+=steer*c.speed*.026*dt;
  c.mesh.rotation.y=c.angle;
  const next=c.mesh.position.clone();
  next.x+=Math.sin(c.angle)*c.speed*dt;
  next.z+=Math.cos(c.angle)*c.speed*dt;
  if(!buildingCollision(next,1.3)&&!carCollision(next,c,3.1)&&Math.abs(next.x)<875&&Math.abs(next.z)<875)c.mesh.position.copy(next);
  else{c.speed*=-.22;wanted=Math.min(5,wanted+1);show("Collision — wanted level increased")}
}

/* traffic */
function updateTraffic(dt){
  for(const c of traffic){
    c.mesh.position.x+=Math.sin(c.angle)*c.speed*dt;
    c.mesh.position.z+=Math.cos(c.angle)*c.speed*dt;
    if(c.mesh.position.x>900)c.mesh.position.x=-900;
    if(c.mesh.position.x<-900)c.mesh.position.x=900;
    if(c.mesh.position.z>900)c.mesh.position.z=-900;
    if(c.mesh.position.z<-900)c.mesh.position.z=900;
    c.mesh.rotation.y=c.angle;
  }
}
function updatePedestrians(dt){
  for(const p of pedestrians){
    p.mesh.position.x+=Math.sin(p.dir)*p.speed*dt;
    p.mesh.position.z+=Math.cos(p.dir)*p.speed*dt;
    if(Math.random()<.008)p.dir+=(Math.random()-.5)*1.8;
    if(Math.abs(p.mesh.position.x)>880||Math.abs(p.mesh.position.z)>880)p.dir+=Math.PI;
  }
}

/* -------------------- wanted / mission -------------------- */
let wanted=0, wantedTimer=0, money=5000, health=100;
function updateWanted(dt){
  if(wanted>0){wantedTimer+=dt;if(wantedTimer>22){wanted--;wantedTimer=0}}
}
function checkMission(){
  const pos=driving?currentVehicle.mesh.position:player.position;
  if(pos.distanceTo(marker.position)<10){
    const m=missions[missionIndex];money+=m.reward;
    show(`MISSION COMPLETE • +$${m.reward}`);
    missionIndex=(missionIndex+1)%missions.length;loadMission();
  }
}

/* -------------------- camera -------------------- */
function updateCamera(dt){
  const t=driving?currentVehicle.mesh:player;
  const back=driving?10:7.5, height=driving?4.3:3.2;
  const desired=new THREE.Vector3(
    t.position.x-Math.sin(yaw)*back,
    t.position.y+height+pitch*4,
    t.position.z-Math.cos(yaw)*back
  );
  camera.position.lerp(desired,1-Math.pow(.001,dt));
  camera.lookAt(t.position.x,t.position.y+1.15,t.position.z);
}

/* -------------------- time / neon -------------------- */
let worldTime=18.67;
function updateTime(dt){
  worldTime+=dt*.075;if(worldTime>=24)worldTime-=24;
  const sunAngle=(worldTime-6)/24*Math.PI*2;
  const daylight=Math.max(0,Math.sin(sunAngle));
  sun.intensity=.25+daylight*3.0;
  hemi.intensity=.35+daylight*1.45;
  moon.intensity=daylight<.15?.7:0;
  const night=daylight<.22;
  scene.background.set(night?0x090d1a:daylight<.5?0x47344e:0x8eb8dc);
  scene.fog.color.copy(scene.background);
  for(const l of streetLights)l.intensity=night?1.6:0;
  const hh=Math.floor(worldTime), mm=Math.floor((worldTime-hh)*60);
  document.getElementById("clock").textContent=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");
}

/* -------------------- minimap -------------------- */
const map=document.getElementById("map"),ctx=map.getContext("2d");
function minimap(){
  ctx.clearRect(0,0,210,210);ctx.fillStyle="#111821";ctx.fillRect(0,0,210,210);
  const scale=.095,center=105;
  ctx.strokeStyle="#3d464f";ctx.lineWidth=4;
  for(const p of roadXs){
    const q=center+p*scale;ctx.beginPath();ctx.moveTo(q,0);ctx.lineTo(q,210);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,q);ctx.lineTo(210,q);ctx.stroke();
  }
  const pos=driving?currentVehicle.mesh.position:player.position;
  ctx.fillStyle="#20ff76";ctx.beginPath();ctx.arc(center+pos.x*scale,center+pos.z*scale,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#159cff";ctx.beginPath();ctx.arc(center+marker.position.x*scale,center+marker.position.z*scale,5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#ff4d59";
  for(const c of traffic){
    ctx.fillRect(center+c.mesh.position.x*scale-2,center+c.mesh.position.z*scale-2,4,4);
  }
}

/* -------------------- HUD -------------------- */
function updateHUD(){
  document.getElementById("money").textContent="$"+money.toLocaleString();
  document.getElementById("health").style.width=health+"%";
  document.getElementById("wanted").textContent="★".repeat(wanted)+"☆".repeat(5-wanted);
  document.getElementById("vehicleName").textContent=driving?currentVehicle.name:"ON FOOT";
  document.getElementById("speed").textContent=driving?Math.round(Math.abs(currentVehicle.speed)*5.2)+" km/h":"0 km/h";
}
let msgTimer;
function show(t){
  const e=document.getElementById("message");e.textContent=t;e.style.opacity=1;
  clearTimeout(msgTimer);msgTimer=setTimeout(()=>e.style.opacity=0,2200);
}

/* -------------------- animation -------------------- */
let last=performance.now(),started=false;
function animate(now){
  if(!started)return;
  requestAnimationFrame(animate);
  const dt=Math.min((now-last)/1000,.05);last=now;
  updatePlayer(dt);updateCar(dt);updateTraffic(dt);updatePedestrians(dt);
  updateWanted(dt);updateCamera(dt);updateTime(dt);checkMission();updateHUD();minimap();
  marker.rotation.y+=dt*1.8;
  renderer.render(scene,camera);
}

document.getElementById("startBtn").onclick=()=>{
  document.getElementById("start").style.display="none";
  started=true;
  renderer.domElement.requestPointerLock?.();
  show("Welcome to Neon Coast");
  animate(performance.now());
};
addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
updateHUD();
</script>
</body>
</html>
