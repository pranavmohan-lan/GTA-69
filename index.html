<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neon Coast Open World</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070a;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
}

#loading{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#05070a;
    color:white;
    font-size:24px;
}

#loading small{
    display:block;
    margin-top:10px;
    color:#999;
    font-size:13px;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#stats{
    position:absolute;
    top:20px;
    left:20px;
    padding:18px;
    width:260px;
    border-radius:16px;
    background:rgba(0,0,0,.65);
    backdrop-filter:blur(12px);
}

.cash{
    color:#54ff71;
    font-size:28px;
    font-weight:bold;
    margin-bottom:12px;
}

.bar{
    height:9px;
    background:#292929;
    border-radius:10px;
    overflow:hidden;
    margin-top:5px;
    margin-bottom:12px;
}

#health{
    width:100%;
    height:100%;
    background:#41ed69;
}

#wanted{
    color:#ffd52d;
    letter-spacing:4px;
}

#mission{
    position:absolute;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.7);
    padding:15px 25px;
    border-radius:14px;
    min-width:400px;
    text-align:center;
}

#vehicle{
    position:absolute;
    top:20px;
    right:20px;
    background:rgba(0,0,0,.65);
    padding:18px;
    border-radius:16px;
    min-width:200px;
}

#vehicleName{
    font-size:18px;
    font-weight:bold;
}

#speed{
    font-size:30px;
    font-weight:bold;
}

#controls{
    position:absolute;
    bottom:20px;
    left:20px;
    padding:15px;
    background:rgba(0,0,0,.65);
    border-radius:12px;
    font-size:13px;
    line-height:1.7;
}

#message{
    position:absolute;
    bottom:130px;
    left:50%;
    transform:translateX(-50%);
    background:rgba(0,0,0,.8);
    padding:14px 25px;
    border-radius:12px;
    opacity:0;
    transition:.2s;
}

#crosshair{
    position:absolute;
    left:50%;
    top:50%;
    width:5px;
    height:5px;
    background:white;
    border-radius:50%;
}
</style>
</head>

<body>

<div id="loading">
    <div>
        Loading NEON COAST...
        <small id="loadingText">
            Loading 3D assets
        </small>
    </div>
</div>

<div id="hud">

    <div id="stats">

        <div style="font-size:11px;color:#aaa">
            CASH
        </div>

        <div class="cash" id="cash">
            $5,000
        </div>

        <div style="font-size:11px;color:#aaa">
            HEALTH
        </div>

        <div class="bar">
            <div id="health"></div>
        </div>

        <div style="font-size:11px;color:#aaa">
            WANTED
        </div>

        <div id="wanted">
            ☆☆☆☆☆
        </div>

    </div>

    <div id="mission">
        MISSION: Reach the blue marker
    </div>

    <div id="vehicle">

        <div style="font-size:11px;color:#aaa">
            VEHICLE
        </div>

        <div id="vehicleName">
            ON FOOT
        </div>

        <div id="speed">
            0 KM/H
        </div>

    </div>

    <div id="controls">
        <b>W A S D</b> — Move / Drive<br>
        <b>SHIFT</b> — Sprint<br>
        <b>E</b> — Enter / Exit Vehicle<br>
        <b>SPACE</b> — Brake<br>
        <b>Mouse</b> — Camera
    </div>

    <div id="message"></div>

    <div id="crosshair"></div>

</div>


<script type="importmap">
{
    "imports":{
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    GLTFLoader
} from "three/addons/loaders/GLTFLoader.js";

import {
    DRACOLoader
} from "three/addons/loaders/DRACOLoader.js";


/* =====================================================
   ENGINE
===================================================== */

const scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(
        0x9bb5c8
    );

scene.fog =
    new THREE.FogExp2(
        0x9bb5c8,
        .00075
    );


const camera =
    new THREE.PerspectiveCamera(
        65,
        innerWidth/innerHeight,
        .1,
        3000
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(
        devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure=1.2;

document.body.appendChild(
    renderer.domElement
);


/* =====================================================
   MODEL LOADER
===================================================== */

const loader =
    new GLTFLoader();


/*
   Draco allows compressed GLB models
   to load efficiently.
*/

const draco =
    new DRACOLoader();

draco.setDecoderPath(
    "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/"
);

loader.setDRACOLoader(
    draco
);


/* =====================================================
   MODEL FUNCTION
===================================================== */

async function loadModel(
    path,
    scale=1
){

    try{

        const gltf =
            await loader.loadAsync(
                path
            );


        const model =
            gltf.scene;


        model.scale.setScalar(
            scale
        );


        model.traverse(
            object=>{

                if(
                    object.isMesh
                ){

                    object.castShadow=true;

                    object.receiveShadow=true;


                    if(
                        object.material
                    ){

                        object.material
                            .envMapIntensity=1.5;
                    }
                }
            }
        );


        return {
            model:model,
            animations:gltf.animations
        };

    }catch(error){

        console.error(
            "Could not load:",
            path,
            error
        );

        throw error;
    }
}


/* =====================================================
   LIGHTING
===================================================== */

const hemi =
    new THREE.HemisphereLight(
        0xffe1ce,
        0x19212c,
        1.8
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffd0aa,
        3
    );

sun.position.set(
    -300,
    500,
    -300
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-1000;
sun.shadow.camera.right=1000;
sun.shadow.camera.top=1000;
sun.shadow.camera.bottom=-1000;

scene.add(sun);


/* =====================================================
   WORLD
===================================================== */

const WORLD=1800;

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            WORLD,
            WORLD
        ),
        new THREE.MeshStandardMaterial({
            color:0x3e5844,
            roughness:1
        })
    );

ground.rotation.x=
    -Math.PI/2;

ground.receiveShadow=true;

scene.add(ground);


/* =====================================================
   ROADS
===================================================== */

const roads=[];

const roadMaterial =
    new THREE.MeshStandardMaterial({
        color:0x202226,
        roughness:.9
    });

for(
    let p=-840;
    p<=840;
    p+=120
){

    const vertical =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                26,
                .08,
                WORLD
            ),
            roadMaterial
        );

    vertical.position.set(
        p,
        .04,
        0
    );

    scene.add(vertical);


    const horizontal =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                WORLD,
                .08,
                26
            ),
            roadMaterial
        );

    horizontal.position.set(
        0,
        .04,
        p
    );

    scene.add(horizontal);


    roads.push(p);
}


/* =====================================================
   BUILDINGS
===================================================== */

const buildingBoxes=[];


function createBuilding(
    x,
    z,
    w,
    d,
    h
){

    const building =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                h,
                d
            ),
            new THREE.MeshStandardMaterial({
                color:
                    new THREE.Color()
                        .setHSL(
                            .58+
                            Math.random()*.12,
                            .12,
                            .32+
                            Math.random()*.2
                        ),
                roughness:.75
            })
        );


    building.position.set(
        x,
        h/2,
        z
    );


    building.castShadow=true;
    building.receiveShadow=true;

    scene.add(building);


    buildingBoxes.push({
        minX:x-w/2,
        maxX:x+w/2,
        minZ:z-d/2,
        maxZ:z+d/2
    });
}


for(
    let x=-840;
    x<840;
    x+=120
){

    for(
        let z=-840;
        z<840;
        z+=120
    ){

        if(
            Math.random()<.12
        )
            continue;


        createBuilding(
            x+60,
            z+60,
            55+
                Math.random()*30,
            55+
                Math.random()*30,
            20+
                Math.random()*100
        );
    }
}


/* =====================================================
   PLAYER
===================================================== */

let player;
let playerMixer=null;

async function createPlayer(){

    const result =
        await loadModel(
            "./models/player.glb",
            1
        );


    player=result.model;

    player.position.set(
        0,
        0,
        20
    );


    scene.add(
        player
    );


    /*
       If the model contains
       walk/run animations,
       play the first one.
    */

    if(
        result.animations.length
    ){

        playerMixer =
            new THREE.AnimationMixer(
                player
            );


        const action =
            playerMixer.clipAction(
                result.animations[0]
            );

        action.play();
    }
}


/* =====================================================
   VEHICLES
===================================================== */

const vehicles=[];


async function createVehicle(
    modelPath,
    name,
    x,
    z,
    scale=1
){

    const result =
        await loadModel(
            modelPath,
            scale
        );


    const vehicle={
        model:result.model,
        name:name,
        speed:0,
        rotation:0,
        driving:false
    };


    vehicle.model.position.set(
        x,
        0,
        z
    );


    scene.add(
        vehicle.model
    );


    vehicles.push(
        vehicle
    );


    return vehicle;
}


/* =====================================================
   LOAD REAL CARS
===================================================== */

let sportsCar;
let superCar;
let sedan;


async function loadVehicles(){

    sportsCar =
        await createVehicle(
            "./models/sports_car.glb",
            "APEX R",
            0,
            55,
            1
        );


    superCar =
        await createVehicle(
            "./models/super_car.glb",
            "VORTEX",
            60,
            0,
            1
        );


    sedan =
        await createVehicle(
            "./models/sedan.glb",
            "CITY SEDAN",
            -60,
            0,
            1
        );
}


/* =====================================================
   PEDESTRIANS
===================================================== */

const pedestrians=[];


async function createPedestrian(
    x,
    z
){

    const result =
        await loadModel(
            "./models/pedestrian.glb",
            .95
        );


    const person=result.model;


    person.position.set(
        x,
        0,
        z
    );


    scene.add(person);


    let mixer=null;


    if(
        result.animations.length
    ){

        mixer=
            new THREE.AnimationMixer(
                person
            );


        const walk =
            result.animations.find(
                animation=>
                    /walk/i.test(
                        animation.name
                    )
            ) ||
            result.animations[0];


        mixer.clipAction(
            walk
        ).play();
    }


    pedestrians.push({
        model:person,
        mixer:mixer,
        direction:
            Math.random()*
            Math.PI*2,
        speed:
            .5+
            Math.random()
    });
}


/* =====================================================
   CREATE PEOPLE
===================================================== */

async function loadPeople(){

    const promises=[];


    for(
        let i=0;
        i<35;
        i++
    ){

        const road=
            roads[
                Math.floor(
                    Math.random()*
                    roads.length
                )
            ];


        let x,z;


        if(
            Math.random()<.5
        ){

            x=
                road+
                (Math.random()<.5
                    ?-20
                    :20);

            z=
                -800+
                Math.random()*1600;

        }else{

            z=
                road+
                (Math.random()<.5
                    ?-20
                    :20);

            x=
                -800+
                Math.random()*1600;
        }


        promises.push(
            createPedestrian(
                x,
                z
            )
        );
    }


    await Promise.all(
        promises
    );
}


/* =====================================================
   COLLISION
===================================================== */

function buildingCollision(
    position,
    radius=.8
){

    for(
        const b of
        buildingBoxes
    ){

        if(
            position.x>
                b.minX-radius &&
            position.x<
                b.maxX+radius &&
            position.z>
                b.minZ-radius &&
            position.z<
                b.maxZ+radius
        ){

            return true;
        }
    }


    return false;
}


/* =====================================================
   INPUT
===================================================== */

const keys={};


addEventListener(
    "keydown",
    event=>{

        keys[event.code]=true;


        if(
            event.code==="KeyE"
        ){

            toggleVehicle();
        }
    }
);


addEventListener(
    "keyup",
    event=>{
        keys[event.code]=false;
    }
);


/* =====================================================
   VEHICLE CONTROL
===================================================== */

let currentVehicle=null;


function toggleVehicle(){

    if(
        currentVehicle
    ){

        player.visible=true;


        player.position.copy(
            currentVehicle.model.position
        );


        player.position.x+=3;


        currentVehicle=
            null;


        return;
    }


    let nearest=null;
    let closest=5;


    for(
        const vehicle of
        vehicles
    ){

        const distance=
            player.position.distanceTo(
                vehicle.model.position
            );


        if(
            distance<closest
        ){

            closest=distance;
            nearest=vehicle;
        }
    }


    if(nearest){

        currentVehicle=
            nearest;

        player.visible=false;
    }
}


/* =====================================================
   PLAYER MOVEMENT
===================================================== */

let yaw=0;


function updatePlayer(
    dt
){

    if(
        !player ||
        currentVehicle
    )
        return;


    let forward=0;
    let side=0;


    if(keys.KeyW)
        forward++;

    if(keys.KeyS)
        forward--;

    if(keys.KeyA)
        side--;

    if(keys.KeyD)
        side++;


    if(
        forward===0 &&
        side===0
    )
        return;


    const direction =
        new THREE.Vector3(
            Math.sin(yaw)*forward+
            Math.cos(yaw)*side,
            0,
            Math.cos(yaw)*forward-
            Math.sin(yaw)*side
        );


    direction.normalize();


    const speed =
        keys.ShiftLeft
        ?10
        :5;


    const next =
        player.position.clone();


    next.addScaledVector(
        direction,
        speed*dt
    );


    if(
        !buildingCollision(
            next,
            .8
        )
    ){

        player.position.copy(
            next
        );
    }


    player.rotation.y=
        Math.atan2(
            direction.x,
            direction.z
        );
}


/* =====================================================
   VEHICLE MOVEMENT
===================================================== */

function updateVehicle(
    dt
){

    if(
        !currentVehicle
    )
        return;


    const car=
        currentVehicle;


    if(keys.KeyW)
        car.speed+=
            20*dt;

    if(keys.KeyS)
        car.speed-=
            15*dt;


    if(keys.Space)
        car.speed*=.90;


    car.speed=
        THREE.MathUtils.clamp(
            car.speed,
            -10,
            35
        );


    const steering =
        (keys.KeyA?1:0)-
        (keys.KeyD?1:0);


    car.rotation+=
        steering*
        car.speed*
        .025*
        dt;


    const next =
        car.model.position.clone();


    next.x+=
        Math.sin(
            car.rotation
        )*
        car.speed*
        dt;


    next.z+=
        Math.cos(
            car.rotation
        )*
        car.speed*
        dt;


    if(
        !buildingCollision(
            next,
            2
        )
    ){

        car.model.position.copy(
            next
        );

    }else{

        car.speed*=-.25;
    }


    car.model.rotation.y=
        car.rotation;
}


/* =====================================================
   PEDESTRIAN UPDATE
===================================================== */

function updatePedestrians(
    dt
){

    for(
        const p of
        pedestrians
    ){

        if(p.mixer)
            p.mixer.update(dt);


        p.model.position.x+=
            Math.sin(
                p.direction
            )*
            p.speed*
            dt;


        p.model.position.z+=
            Math.cos(
                p.direction
            )*
            p.speed*
            dt;


        if(
            buildingCollision(
                p.model.position,
                .5
            )
        ){

            p.direction+=
                Math.PI;
        }


        if(
            Math.random()<.01
        ){

            p.direction+=
                (Math.random()-.5);
        }
    }
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(
    dt
){

    if(
        !player
    )
        return;


    const target=
        currentVehicle
        ?currentVehicle.model
        :player;


    const distance=
        currentVehicle
        ?11
        :7;


    const height=
        currentVehicle
        ?5
        :3.5;


    const desired =
        new THREE.Vector3(
            target.position.x-
            Math.sin(yaw)*
            distance,

            target.position.y+
            height,

            target.position.z-
            Math.cos(yaw)*
            distance
        );


    camera.position.lerp(
        desired,
        1-
        Math.pow(
            .001,
            dt
        )
    );


    camera.lookAt(
        target.position.x,
        target.position.y+
        1,
        target.position.z
    );
}


/* =====================================================
   MISSION
===================================================== */

const mission={
    x:400,
    z:300,
    reward:1000
};


const marker =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            6,
            6,
            .25,
            40
        ),
        new THREE.MeshBasicMaterial({
            color:0x009cff,
            transparent:true,
            opacity:.75
        })
    );


marker.position.set(
    mission.x,
    .2,
    mission.z
);


scene.add(marker);


let money=5000;


function checkMission(){

    if(
        !player
    )
        return;


    const target=
        currentVehicle
        ?currentVehicle.model
        :player;


    if(
        target.position.distanceTo(
            marker.position
        )<12
    ){

        money+=
            mission.reward;


        document.getElementById(
            "cash"
        ).textContent=
            "$"+
            money.toLocaleString();


        showMessage(
            "MISSION COMPLETE +$"+
            mission.reward
        );


        mission.x=
            -700+
            Math.random()*1400;

        mission.z=
            -700+
            Math.random()*1400;


        marker.position.set(
            mission.x,
            .2,
            mission.z
        );
    }
}


/* =====================================================
   MESSAGE
===================================================== */

let messageTimeout;


function showMessage(
    text
){

    const element=
        document.getElementById(
            "message"
        );


    element.textContent=text;

    element.style.opacity=1;


    clearTimeout(
        messageTimeout
    );


    messageTimeout=
        setTimeout(
            ()=>{
                element.style.opacity=0;
            },
            2500
        );
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    if(
        currentVehicle
    ){

        document.getElementById(
            "vehicleName"
        ).textContent=
            currentVehicle.name;


        document.getElementById(
            "speed"
        ).textContent=
            Math.round(
                Math.abs(
                    currentVehicle.speed
                )*5
            )+
            " KM/H";

    }else{

        document.getElementById(
            "vehicleName"
        ).textContent=
            "ON FOOT";


        document.getElementById(
            "speed"
        ).textContent=
            "0 KM/H";
    }
}


/* =====================================================
   MOUSE CAMERA
===================================================== */

let mouseDown=false;


renderer.domElement
.addEventListener(
    "mousedown",
    ()=>{
        mouseDown=true;
    }
);


addEventListener(
    "mouseup",
    ()=>{
        mouseDown=false;
    }
);


addEventListener(
    "mousemove",
    event=>{

        if(!mouseDown)
            return;


        yaw-=
            event.movementX*.003;
    }
);


/* =====================================================
   GAME LOOP
===================================================== */

let clock=
    new THREE.Clock();


function animate(){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            clock.getDelta(),
            .05
        );


    if(playerMixer)
        playerMixer.update(dt);


    updatePlayer(dt);

    updateVehicle(dt);

    updatePedestrians(dt);

    updateCamera(dt);

    updateHUD();

    checkMission();


    marker.rotation.y+=
        dt*2;


    renderer.render(
        scene,
        camera
    );
}


/* =====================================================
   START GAME
===================================================== */

async function start(){

    try{

        document.getElementById(
            "loadingText"
        ).textContent=
            "Loading realistic player...";


        await createPlayer();


        document.getElementById(
            "loadingText"
        ).textContent=
            "Loading realistic vehicles...";


        await loadVehicles();


        document.getElementById(
            "loadingText"
        ).textContent=
            "Loading pedestrians...";


        await loadPeople();


        document.getElementById(
            "loading"
        ).style.display=
            "none";


        showMessage(
            "Welcome to NEON COAST"
        );


        animate();

    }catch(error){

        console.error(error);


        document.getElementById(
            "loadingText"
        ).innerHTML=
            `
            Model loading failed.<br><br>
            Make sure these files exist:<br>
            models/player.glb<br>
            models/pedestrian.glb<br>
            models/sports_car.glb<br>
            models/super_car.glb<br>
            models/sedan.glb
            `;
    }
}


start();


/* =====================================================
   RESIZE
===================================================== */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

</script>
