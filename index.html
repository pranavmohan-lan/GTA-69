<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Open World</title>
<style>
html,body{margin:0;overflow:hidden;background:#87ceeb;font-family:Arial;color:white}
#hud{position:fixed;top:15px;left:15px;z-index:5;background:#0008;padding:12px 16px;border-radius:10px;font-size:14px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#87ceeb;color:white;font-size:28px;z-index:20}
#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;background:white;border-radius:50%;transform:translate(-50%,-50%);z-index:5}
</style>
</head>
<body>

<div id="loading">Loading...</div>
<div id="hud">
<b>OPEN WORLD</b><br>
WASD / Arrow Keys — Move<br>
E — Enter / Exit Car<br>
Mouse — Look
</div>
<div id="cross"></div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
   BASIC SETUP
========================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87c9f5);
scene.fog = new THREE.Fog(0x87c9f5,450,1500);

const camera = new THREE.PerspectiveCamera(
67,innerWidth/innerHeight,.1,1800
);

const renderer = new THREE.WebGLRenderer({
antialias:false,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

/* =========================
   LIGHTING
========================= */

const skyLight=new THREE.HemisphereLight(
0xc9e8ff,
0x52604a,
2.0
);
scene.add(skyLight);

const sun=new THREE.DirectionalLight(
0xfff0d0,
3.2
);

sun.position.set(-250,400,180);
sun.castShadow=true;

sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-350;
sun.shadow.camera.right=350;
sun.shadow.camera.top=350;
sun.shadow.camera.bottom=-350;
sun.shadow.camera.near=1;
sun.shadow.camera.far=900;

scene.add(sun);

/* =========================
   MATERIALS
========================= */

const roadMat=new THREE.MeshStandardMaterial({
color:0x25282b,
roughness:.92
});

const sidewalkMat=new THREE.MeshStandardMaterial({
color:0x777b7d,
roughness:.9
});

const grassMat=new THREE.MeshStandardMaterial({
color:0x4d8a4b,
roughness:1
});

const buildingMat=new THREE.MeshStandardMaterial({
color:0xb8b5ad,
roughness:.82,
metalness:.05
});

const glassMat=new THREE.MeshStandardMaterial({
color:0x183d55,
roughness:.2,
metalness:.4
});

const skinMat=new THREE.MeshStandardMaterial({
color:0xc98d68,
roughness:.8
});

const shirtMat=new THREE.MeshStandardMaterial({
color:0x263c78,
roughness:.8
});

const pantsMat=new THREE.MeshStandardMaterial({
color:0x252525,
roughness:.9
});

const carRed=new THREE.MeshStandardMaterial({
color:0xb51d22,
metalness:.65,
roughness:.28
});

const carBlue=new THREE.MeshStandardMaterial({
color:0x173f91,
metalness:.7,
roughness:.25
});

const tireMat=new THREE.MeshStandardMaterial({
color:0x111111,
roughness:1
});

/* =========================
   GROUND
========================= */

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(1800,1800),
grassMat
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

/* =========================
   ROADS
========================= */

const WORLD=1600;
const ROAD_STEP=160;

function makeRoad(x,z,w,d){
const r=new THREE.Mesh(
new THREE.BoxGeometry(w,.08,d),
roadMat
);
r.position.set(x,.03,z);
r.receiveShadow=true;
scene.add(r);
}

for(let i=-WORLD/2;i<=WORLD/2;i+=ROAD_STEP){

makeRoad(i,0,38,WORLD);
makeRoad(0,i,WORLD,38);

const s1=new THREE.Mesh(
new THREE.BoxGeometry(48,.15,WORLD),
sidewalkMat
);
s1.position.set(i,.10,0);
s1.receiveShadow=true;
scene.add(s1);

const s2=new THREE.Mesh(
new THREE.BoxGeometry(WORLD,.15,48),
sidewalkMat
);
s2.position.set(0,.10,i);
s2.receiveShadow=true;
scene.add(s2);
}

/* =========================
   BUILDINGS
   GENERATED IN BATCHES
========================= */

const buildingGeometry=new THREE.BoxGeometry(1,1,1);

const buildingCount=150;

const buildings=new THREE.InstancedMesh(
buildingGeometry,
buildingMat,
buildingCount
);

buildings.castShadow=true;
buildings.receiveShadow=true;

const dummy=new THREE.Object3D();

let buildingIndex=0;

function addBuilding(){

if(buildingIndex>=buildingCount)return false;

let x=(Math.floor(Math.random()*10)-5)*ROAD_STEP+60;
let z=(Math.floor(Math.random()*10)-5)*ROAD_STEP+60;

if(Math.abs(x%ROAD_STEP)<45)return true;
if(Math.abs(z%ROAD_STEP)<45)return true;

const w=35+Math.random()*45;
const d=35+Math.random()*45;
const h=20+Math.random()*100;

dummy.position.set(x,h/2,z);
dummy.scale.set(w,h,d);
dummy.rotation.y=Math.random()*0.08;

dummy.updateMatrix();

buildings.setMatrixAt(buildingIndex,dummy.matrix);
buildingIndex++;

return true;
}

scene.add(buildings);

/* =========================
   WINDOWS
========================= */

function addBuildingWindows(){

for(let i=0;i<40;i++){

const x=(Math.floor(Math.random()*10)-5)*ROAD_STEP+60;
const z=(Math.floor(Math.random()*10)-5)*ROAD_STEP+60;

const h=30+Math.random()*70;

const window=new THREE.Mesh(
new THREE.BoxGeometry(2,.15,2.8),
glassMat
);

window.position.set(
x+18,
h*.65,
z
);

scene.add(window);
}
}

/* =========================
   HUMAN
========================= */

function makeHuman(x,y,z,player=false){

const human=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.42,1.0,4,8),
shirtMat
);

body.position.y=1.35;
body.castShadow=true;

const head=new THREE.Mesh(
new THREE.SphereGeometry(.38,12,8),
skinMat
);

head.position.y=2.3;
head.castShadow=true;

const legGeo=new THREE.CapsuleGeometry(.18,.75,4,6);

const leftLeg=new THREE.Mesh(legGeo,pantsMat);
const rightLeg=new THREE.Mesh(legGeo,pantsMat);

leftLeg.position.set(-.2,.55,0);
rightLeg.position.set(.2,.55,0);

leftLeg.castShadow=true;
rightLeg.castShadow=true;

const armGeo=new THREE.CapsuleGeometry(.13,.65,4,6);

const leftArm=new THREE.Mesh(armGeo,shirtMat);
const rightArm=new THREE.Mesh(armGeo,shirtMat);

leftArm.position.set(-.55,1.4,0);
rightArm.position.set(.55,1.4,0);

leftArm.rotation.z=-.08;
rightArm.rotation.z=.08;

leftArm.castShadow=true;
rightArm.castShadow=true;

human.add(
body,head,
leftLeg,rightLeg,
leftArm,rightArm
);

human.position.set(x,y,z);
scene.add(human);

return {
group:human,
leftLeg,
rightLeg,
leftArm,
rightArm,
player
};
}

/* PLAYER */

const player=makeHuman(0,0,65,true);

let playerCar=null;
let driving=false;

/* =========================
   CARS
========================= */

function makeCar(x,z,color=carRed){

const car=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(4.4,1.05,8),
color
);

body.position.y=1;
body.castShadow=true;

const roof=new THREE.Mesh(
new THREE.BoxGeometry(3.5,1.05,3.7),
color
);

roof.position.set(0,1.8,-.3);
roof.castShadow=true;

const windshield=new THREE.Mesh(
new THREE.BoxGeometry(3.25,.7,1.7),
glassMat
);

windshield.position.set(0,1.85,.8);

const wheelGeo=new THREE.CylinderGeometry(
.72,.72,.38,12
);

const wheels=[];

for(const px of [-1.85,1.85]){
for(const pz of [-2.6,2.6]){

const wheel=new THREE.Mesh(
wheelGeo,
tireMat
);

wheel.rotation.z=Math.PI/2;
wheel.position.set(px,.72,pz);

wheel.castShadow=true;

car.add(wheel);
wheels.push(wheel);
}
}

car.add(body,roof,windshield);

car.position.set(x,.05,z);

scene.add(car);

return {
group:car,
speed:0,
wheels
};
}

/* PLAYER CAR */

playerCar=makeCar(0,35,carBlue);

/* TRAFFIC */

const traffic=[];

for(let i=0;i<14;i++){

const horizontal=Math.random()>.5;

const car=makeCar(
horizontal
? (Math.random()-.5)*1200
: Math.round((Math.random()*8-4))*ROAD_STEP,
horizontal
? Math.round((Math.random()*8-4))*ROAD_STEP
: (Math.random()-.5)*1200,
Math.random()>.5?carRed:carBlue
);

car.horizontal=horizontal;
car.speed=15+Math.random()*10;

traffic.push(car);
}

/* =========================
   PEDestrians
========================= */

const pedestrians=[];

for(let i=0;i<20;i++){

const p=makeHuman(
(Math.random()-.5)*1200,
0,
(Math.random()-.5)*1200
);

p.group.position.y=0;
p.speed=.6+Math.random()*1.1;

pedestrians.push(p);
}

/* =========================
   WORLD GENERATION
========================= */

let worldReady=false;

function buildStep(){

let amount=0;

while(amount<8 && buildingIndex<buildingCount){

addBuilding();
amount++;
}

if(buildingIndex>=buildingCount && !worldReady){

addBuildingWindows();

worldReady=true;

document.getElementById("loading").style.display="none";
}

if(!worldReady){
requestAnimationFrame(buildStep);
}
}

requestAnimationFrame(buildStep);

/* =========================
   CONTROLS
========================= */

const keys={};

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;

if(e.key.toLowerCase()==="e"){
toggleCar();
}
});

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

/* =========================
   MOUSE LOOK
========================= */

let yaw=0;
let pitch=.15;

document.body.addEventListener("click",()=>{
if(document.pointerLockElement!==document.body)
document.body.requestPointerLock();
});

addEventListener("mousemove",e=>{

if(document.pointerLockElement!==document.body)return;

yaw-=e.movementX*.002;
pitch-=e.movementY*.001;

pitch=Math.max(-.25,Math.min(.55,pitch));
});

/* =========================
   ENTER / EXIT CAR
========================= */

function toggleCar(){

if(!playerCar)return;

if(!driving){

const dx=player.group.position.x-playerCar.group.position.x;
const dz=player.group.position.z-playerCar.group.position.z;

if(Math.hypot(dx,dz)<8){

driving=true;
player.group.visible=false;
playerCar.group.position.copy(player.group.position);
}
}
else{

driving=false;
player.group.visible=true;

player.group.position.copy(playerCar.group.position);
player.group.position.x+=5;
}
}

/* =========================
   PLAYER MOVEMENT
========================= */

const clock=new THREE.Clock();

function updatePlayer(dt){

if(driving){

let throttle=0;

if(keys.w||keys.arrowup)throttle=1;
if(keys.s||keys.arrowdown)throttle=-1;

playerCar.speed+=throttle*28*dt;
playerCar.speed*=Math.pow(.88,dt*10);

playerCar.speed=Math.max(-12,Math.min(65,playerCar.speed));

let steering=0;

if(keys.a||keys.arrowleft)steering=1;
if(keys.d||keys.arrowright)steering=-1;

playerCar.group.rotation.y+=
steering*playerCar.speed*.018*dt;

const forward=new THREE.Vector3(
Math.sin(playerCar.group.rotation.y),
0,
Math.cos(playerCar.group.rotation.y)
);

playerCar.group.position.addScaledVector(
forward,
playerCar.speed*dt
);

}
else{

let mx=0;
let mz=0;

if(keys.w||keys.arrowup)mz-=1;
if(keys.s||keys.arrowdown)mz+=1;
if(keys.a||keys.arrowleft)mx-=1;
if(keys.d||keys.arrowright)mx+=1;

const len=Math.hypot(mx,mz);

if(len){

mx/=len;
mz/=len;

const speed=9;

const sin=Math.sin(yaw);
const cos=Math.cos(yaw);

player.group.position.x+=
(mx*cos-mz*sin)*speed*dt;

player.group.position.z+=
(mx*sin+mz*cos)*speed*dt;
}

player.group.rotation.y=yaw;
}
}

/* =========================
   HUMAN ANIMATION
========================= */

let animTime=0;

function updateHumans(dt){

animTime+=dt*7;

if(!driving){

const moving=
keys.w||keys.a||keys.s||keys.d||
keys.arrowup||keys.arrowdown||
keys.arrowleft||keys.arrowright;

if(moving){

player.leftLeg.rotation.x=Math.sin(animTime)*.7;
player.rightLeg.rotation.x=-Math.sin(animTime)*.7;

player.leftArm.rotation.x=-Math.sin(animTime)*.5;
player.rightArm.rotation.x=Math.sin(animTime)*.5;

}else{

player.leftLeg.rotation.x*=.8;
player.rightLeg.rotation.x*=.8;
player.leftArm.rotation.x*=.8;
player.rightArm.rotation.x*=.8;
}
}

for(const p of pedestrians){

p.group.position.x+=
Math.sin(p.group.rotation.y)*p.speed*dt;

p.group.position.z+=
Math.cos(p.group.rotation.y)*p.speed*dt;

if(Math.random()<.004)
p.group.rotation.y+=
(Math.random()-.5)*Math.PI;

const t=animTime+p.group.position.x;

p.leftLeg.rotation.x=Math.sin(t)*.45;
p.rightLeg.rotation.x=-Math.sin(t)*.45;
}
}

/* =========================
   TRAFFIC
========================= */

function updateTraffic(dt){

for(const car of traffic){

if(car.horizontal){

car.group.position.x+=car.speed*dt;

if(car.group.position.x>800)
car.group.position.x=-800;

}else{

car.group.position.z+=car.speed*dt;

if(car.group.position.z>800)
car.group.position.z=-800;
}
}
}

/* =========================
   CAMERA
========================= */

const camTarget=new THREE.Vector3();

function updateCamera(){

if(driving){

const pos=playerCar.group.position;

const behind=new THREE.Vector3(
Math.sin(playerCar.group.rotation.y),
0,
Math.cos(playerCar.group.rotation.y)
);

camera.position.lerp(
new THREE.Vector3(
pos.x-behind.x*12,
pos.y+5.5,
pos.z-behind.z*12
),.12
);

camTarget.set(
pos.x,
pos.y+1.5,
pos.z
);

}
else{

const pos=player.group.position;

const behind=new THREE.Vector3(
Math.sin(yaw),
0,
Math.cos(yaw)
);

camera.position.lerp(
new THREE.Vector3(
pos.x+behind.x*7,
pos.y+3.3,
pos.z+behind.z*7
),.15
);

camTarget.set(
pos.x,
pos.y+1.4,
pos.z
);
}

camera.lookAt(camTarget);
}

/* =========================
   RESIZE
========================= */

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);
});

/* =========================
   GAME LOOP
========================= */

function animate(){

requestAnimationFrame(animate);

const dt=Math.min(clock.getDelta(),.033);

updatePlayer(dt);
updateHumans(dt);
updateTraffic(dt);
updateCamera();

renderer.render(scene,camera);
}

animate();

/* Hide loading even if world generation
   is still finishing */
setTimeout(()=>{
document.getElementById("loading").style.display="none";
},2500);

</script>
</body>
</html>
