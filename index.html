<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Realistic Day City</title>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87bfe8;font-family:Arial,sans-serif}
canvas{display:block}
#hud{
position:fixed;top:18px;left:18px;z-index:5;
color:white;text-shadow:0 2px 5px #000;
font-weight:bold;pointer-events:none
}
#cash{font-size:22px}
#status{margin-top:6px;font-size:14px}
#controls{
position:fixed;bottom:18px;left:18px;z-index:5;
padding:10px 14px;border-radius:10px;
background:rgba(0,0,0,.48);color:white;font-size:13px;
pointer-events:none
}
#loading{
position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;background:#87bfe8;color:white;
font-size:24px;z-index:20
}
</style>
</head>

<body>

<div id="loading">Loading city...</div>

<div id="hud">
<div id="cash">$10,000</div>
<div id="status">ON FOOT • DAYTIME</div>
</div>

<div id="controls">
WASD / Arrow Keys — Move<br>
SHIFT — Sprint<br>
E — Enter / Exit car<br>
SPACE — Brake
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {GLTFLoader} from
"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js";

/* =========================================================
   PERFORMANCE
========================================================= */

const renderer=new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"high-performance"
});

renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.25;

document.body.appendChild(renderer.domElement);


/* =========================================================
   SCENE
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x8ec7ec);

scene.fog=new THREE.Fog(
    0x8ec7ec,
    700,
    1800
);


/* =========================================================
   CAMERA
========================================================= */

const camera=new THREE.PerspectiveCamera(
    65,
    innerWidth/innerHeight,
    .1,
    2200
);

camera.position.set(0,4.5,10);


/* =========================================================
   DAY LIGHTING ONLY
========================================================= */

const skyLight=new THREE.HemisphereLight(
    0xe9f7ff,
    0x56645b,
    2.2
);

scene.add(skyLight);

const sun=new THREE.DirectionalLight(
    0xfff0cf,
    4.0
);

sun.position.set(
    -400,
    600,
    -300
);

sun.castShadow=true;

sun.shadow.mapSize.set(
    2048,
    2048
);

sun.shadow.camera.left=-800;
sun.shadow.camera.right=800;
sun.shadow.camera.top=800;
sun.shadow.camera.bottom=-800;
sun.shadow.camera.near=10;
sun.shadow.camera.far=1800;

sun.shadow.bias=-0.0002;

scene.add(sun);

const fill=new THREE.DirectionalLight(
    0xbddcff,
    .7
);

fill.position.set(
    400,
    250,
    400
);

scene.add(fill);


/* =========================================================
   MATERIALS
========================================================= */

const roadMat=new THREE.MeshStandardMaterial({
    color:0x25282b,
    roughness:.95
});

const sidewalkMat=new THREE.MeshStandardMaterial({
    color:0x858585,
    roughness:.9
});

const grassMat=new THREE.MeshStandardMaterial({
    color:0x4d7d43,
    roughness:1
});

const buildingMats=[
    new THREE.MeshStandardMaterial({color:0xc7c3b7,roughness:.8}),
    new THREE.MeshStandardMaterial({color:0xb5c0c5,roughness:.75}),
    new THREE.MeshStandardMaterial({color:0xd5b79a,roughness:.8}),
    new THREE.MeshStandardMaterial({color:0xaeb7a9,roughness:.85}),
    new THREE.MeshStandardMaterial({color:0xd2d0cb,roughness:.8})
];


/* =========================================================
   GROUND
========================================================= */

const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(2000,2000),
    grassMat
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);


/* =========================================================
   WORLD
========================================================= */

const WORLD=1800;
const ROAD_STEP=120;
const ROAD_WIDTH=28;

const staticObjects=[];

function addBox(
    x,y,z,
    sx,sy,sz,
    material,
    shadow=true
){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(sx,sy,sz),
        material
    );

    mesh.position.set(x,y,z);

    mesh.castShadow=shadow;
    mesh.receiveShadow=true;

    scene.add(mesh);

    staticObjects.push(mesh);

    return mesh;
}


/* =========================================================
   ROADS
========================================================= */

for(let x=-WORLD/2;x<=WORLD/2;x+=ROAD_STEP){

    addBox(
        x,.02,0,
        ROAD_WIDTH,.04,WORLD,
        roadMat,false
    );

    addBox(
        x, .05, ROAD_WIDTH/2+3,
        ROAD_WIDTH+6,.1,6,
        sidewalkMat,false
    );

    addBox(
        x, .05,-ROAD_WIDTH/2-3,
        ROAD_WIDTH+6,.1,6,
        sidewalkMat,false
    );
}

for(let z=-WORLD/2;z<=WORLD/2;z+=ROAD_STEP){

    addBox(
        0,.025,z,
        WORLD,.05,ROAD_WIDTH,
        roadMat,false
    );

    addBox(
        ROAD_WIDTH/2+3,.05,z,
        6,.1,ROAD_WIDTH+6,
        sidewalkMat,false
    );

    addBox(
        -ROAD_WIDTH/2-3,.05,z,
        6,.1,ROAD_WIDTH+6,
        sidewalkMat,false
    );
}


/* =========================================================
   BUILDINGS
========================================================= */

for(let x=-WORLD/2+45;x<WORLD/2-45;x+=ROAD_STEP){

    for(let z=-WORLD/2+45;z<WORLD/2-45;z+=ROAD_STEP){

        const height=
            25+
            Math.random()*90;

        const width=
            45+
            Math.random()*20;

        const depth=
            45+
            Math.random()*20;

        const mat=
            buildingMats[
                Math.floor(
                    Math.random()*buildingMats.length
                )
            ];

        const building=addBox(
            x,
            height/2,
            z,
            width,
            height,
            depth,
            mat,
            true
        );

        building.userData.isBuilding=true;

        /* roof */
        if(Math.random()>.65){

            addBox(
                x,
                height+1,
                z,
                width*.7,
                2,
                depth*.7,
                mat,
                true
            );
        }
    }
}


/* =========================================================
   TREES
========================================================= */

function makeTree(x,z){

    const group=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .25,.35,5,8
        ),
        new THREE.MeshStandardMaterial({
            color:0x68452b,
            roughness:1
        })
    );

    trunk.position.y=2.5;

    const leaves=new THREE.Mesh(
        new THREE.SphereGeometry(
            3.3,10,8
        ),
        new THREE.MeshStandardMaterial({
            color:0x2f7d3d,
            roughness:1
        })
    );

    leaves.position.y=6;

    group.add(trunk,leaves);

    group.position.set(x,0,z);

    trunk.castShadow=true;
    leaves.castShadow=true;

    scene.add(group);
}

for(let i=0;i<180;i++){

    const x=
        Math.round(
            (Math.random()*WORLD-WORLD/2)/10
        )*10;

    const z=
        Math.round(
            (Math.random()*WORLD-WORLD/2)/10
        )*10;

    if(
        Math.abs(x%ROAD_STEP)>22 &&
        Math.abs(z%ROAD_STEP)>22
    ){
        makeTree(x,z);
    }
}


/* =========================================================
   HIGH QUALITY-STYLE HUMAN
========================================================= */

function makeHuman(){

    const g=new THREE.Group();

    const skin=new THREE.MeshStandardMaterial({
        color:0xa96f50,
        roughness:.75
    });

    const shirt=new THREE.MeshStandardMaterial({
        color:0x19589a,
        roughness:.75
    });

    const pants=new THREE.MeshStandardMaterial({
        color:0x20252b,
        roughness:.9
    });

    const shoes=new THREE.MeshStandardMaterial({
        color:0x111111,
        roughness:.7
    });

    const hairMat=new THREE.MeshStandardMaterial({
        color:0x171513,
        roughness:1
    });

    /* legs */

    for(const side of[-1,1]){

        const leg=new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .13,.72,6,10
            ),
            pants
        );

        leg.position.set(
            side*.14,
            .7,
            0
        );

        leg.castShadow=true;

        g.add(leg);

        const shoe=new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,.12,.5
            ),
            shoes
        );

        shoe.position.set(
            side*.14,
            .18,
            -.08
        );

        shoe.castShadow=true;

        g.add(shoe);
    }

    /* torso */

    const torso=new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .32,.65,8,12
        ),
        shirt
    );

    torso.position.y=1.35;
    torso.castShadow=true;

    g.add(torso);

    /* neck */

    const neck=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .11,.12,.16,12
        ),
        skin
    );

    neck.position.y=1.83;

    g.add(neck);

    /* head */

    const head=new THREE.Mesh(
        new THREE.SphereGeometry(
            .3,24,18
        ),
        skin
    );

    head.position.y=2.12;
    head.castShadow=true;

    g.add(head);

    /* hair */

    const hair=new THREE.Mesh(
        new THREE.SphereGeometry(
            .31,24,16,
            0,Math.PI*2,
            0,Math.PI*.55
        ),
        hairMat
    );

    hair.position.y=2.24;

    g.add(hair);

    /* arms */

    for(const side of[-1,1]){

        const arm=new THREE.Mesh(
            new THREE.CapsuleGeometry(
                .11,.58,6,10
            ),
            shirt
        );

        arm.position.set(
            side*.42,
            1.42,
            0
        );

        arm.rotation.z=
            side*.12;

        arm.castShadow=true;

        g.add(arm);
    }

    return g;
}


/* =========================================================
   PLAYER
========================================================= */

const player=makeHuman();

player.position.set(
    0,
    0,
    30
);

scene.add(player);


/* =========================================================
   CARS
========================================================= */

function makeCar(type="super"){

    const g=new THREE.Group();

    let bodyColor;

    if(type==="super")
        bodyColor=0xc71919;
    else if(type==="luxury")
        bodyColor=0x111317;
    else
        bodyColor=0x1b5ca8;

    const bodyMat=new THREE.MeshStandardMaterial({
        color:bodyColor,
        metalness:.8,
        roughness:.22
    });

    const glassMat=new THREE.MeshStandardMaterial({
        color:0x18252e,
        metalness:.2,
        roughness:.08,
        transparent:true,
        opacity:.88
    });

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            2.4,.65,4.7
        ),
        bodyMat
    );

    body.position.y=.65;
    body.castShadow=true;

    g.add(body);

    const roof=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.75,.55,2.25
        ),
        glassMat
    );

    roof.position.set(
        0,1.12,-.15
    );

    roof.castShadow=true;

    g.add(roof);

    const wheelMat=new THREE.MeshStandardMaterial({
        color:0x111111,
        roughness:.9
    });

    for(const x of[-1.05,1.05]){

        for(const z of[-1.55,1.55]){

            const wheel=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .4,.4,.28,16
                ),
                wheelMat
            );

            wheel.rotation.z=Math.PI/2;

            wheel.position.set(
                x,.43,z
            );

            wheel.castShadow=true;

            g.add(wheel);
        }
    }

    /* headlights */

    const lightMat=new THREE.MeshStandardMaterial({
        color:0xffffff,
        emissive:0xffffff,
        emissiveIntensity:2
    });

    for(const x of[-.7,.7]){

        const light=new THREE.Mesh(
            new THREE.BoxGeometry(
                .35,.14,.05
            ),
            lightMat
        );

        light.position.set(
            x,.75,-2.36
        );

        g.add(light);
    }

    return g;
}


/* =========================================================
   PLAYER CAR
========================================================= */

const playerCar=makeCar("super");

playerCar.position.set(
    5,
    0,
    30
);

playerCar.rotation.y=Math.PI;

scene.add(playerCar);


/* =========================================================
   TRAFFIC
========================================================= */

const traffic=[];

for(let i=0;i<24;i++){

    const car=makeCar(
        i%3===0 ? "luxury" :
        i%3===1 ? "sedan" :
        "super"
    );

    const horizontal=Math.random()>.5;

    if(horizontal){

        car.position.set(
            Math.random()*1600-800,
            0,
            Math.round(
                (Math.random()*1600-800)/120
            )*120
        );

        car.userData.axis="x";
        car.userData.speed=
            10+Math.random()*15;

    }else{

        car.position.set(
            Math.round(
                (Math.random()*1600-800)/120
            )*120,
            0,
            Math.random()*1600-800
        );

        car.userData.axis="z";
        car.userData.speed=
            10+Math.random()*15;
    }

    scene.add(car);
    traffic.push(car);
}


/* =========================================================
   INPUT
========================================================= */

const keys={};

addEventListener(
    "keydown",
    e=>{
        keys[e.key.toLowerCase()]=true;
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.key.toLowerCase()]=false;
    }
);


/* =========================================================
   CAMERA
========================================================= */

let cameraYaw=0;
let cameraPitch=.18;

let mouseDown=false;

addEventListener(
    "mousedown",
    ()=>mouseDown=true
);

addEventListener(
    "mouseup",
    ()=>mouseDown=false
);

addEventListener(
    "mousemove",
    e=>{

        if(!mouseDown)return;

        cameraYaw-=e.movementX*.002;
        cameraPitch-=e.movementY*.002;

        cameraPitch=
            THREE.MathUtils.clamp(
                cameraPitch,-.1,.65
            );
    }
);


/* =========================================================
   MOVEMENT
========================================================= */

let inCar=false;

function updatePlayer(dt){

    if(inCar)return;

    let dx=0;
    let dz=0;

    if(keys.w||keys.arrowup)dz-=1;
    if(keys.s||keys.arrowdown)dz+=1;
    if(keys.a||keys.arrowleft)dx-=1;
    if(keys.d||keys.arrowright)dx+=1;

    const length=Math.hypot(dx,dz);

    if(length>0){

        dx/=length;
        dz/=length;

        const speed=
            keys.shift ? 12 : 7;

        player.position.x+=dx*speed*dt;
        player.position.z+=dz*speed*dt;

        player.rotation.y=
            Math.atan2(dx,dz);
    }

    player.position.x=
        THREE.MathUtils.clamp(
            player.position.x,
            -850,850
        );

    player.position.z=
        THREE.MathUtils.clamp(
            player.position.z,
            -850,850
        );
}


/* =========================================================
   ENTER / EXIT
========================================================= */

addEventListener(
    "keydown",
    e=>{

        if(e.key.toLowerCase()!=="e")
            return;

        const distance=
            player.position.distanceTo(
                playerCar.position
            );

        if(!inCar && distance<4){

            inCar=true;
            player.visible=false;

        }else if(inCar){

            player.position.copy(
                playerCar.position
            );

            player.position.x+=3;

            player.visible=true;

            inCar=false;
        }
    }
);


/* =========================================================
   CAR UPDATE
========================================================= */

function updateCar(dt){

    if(!inCar)return;

    let acceleration=0;

    if(keys.w||keys.arrowup)
        acceleration=22;

    if(keys.s||keys.arrowdown)
        acceleration=-12;

    playerCar.translateZ(
        -acceleration*dt
    );

    if(keys.a||keys.arrowleft)
        playerCar.rotation.y+=1.7*dt;

    if(keys.d||keys.arrowright)
        playerCar.rotation.y-=1.7*dt;

    if(keys.space)
        playerCar.translateZ(
            acceleration*dt*.75
        );
}


/* =========================================================
   TRAFFIC UPDATE
========================================================= */

function updateTraffic(dt){

    for(const car of traffic){

        if(car.userData.axis==="x"){

            car.position.x+=
                car.userData.speed*dt;

            if(car.position.x>900)
                car.position.x=-900;

        }else{

            car.position.z+=
                car.userData.speed*dt;

            if(car.position.z>900)
                car.position.z=-900;
        }
    }
}


/* =========================================================
   CAMERA FOLLOW
========================================================= */

function updateCamera(){

    const target=
        inCar ? playerCar : player;

    const distance=
        inCar ? 11 : 8;

    const height=
        inCar ? 4.5 : 4;

    const offset=new THREE.Vector3(
        Math.sin(cameraYaw)*distance,
        height,
        Math.cos(cameraYaw)*distance
    );

    const desired=
        target.position.clone()
        .add(offset);

    camera.position.lerp(
        desired,
        .12
    );

    camera.lookAt(
        target.position.x,
        target.position.y+
        (inCar?1.1:1.25),
        target.position.z
    );
}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "status"
    ).textContent=
        inCar
        ?"DRIVING • DAYTIME"
        :"ON FOOT • DAYTIME";
}


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

        renderer.setPixelRatio(
            Math.min(devicePixelRatio,1.5)
        );
    }
);


/* =========================================================
   START
========================================================= */

document.getElementById(
    "loading"
).style.display="none";


/* =========================================================
   GAME LOOP
========================================================= */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const dt=Math.min(
        clock.getDelta(),
        .033
    );

    updatePlayer(dt);
    updateCar(dt);
    updateTraffic(dt);
    updateCamera();
    updateHUD();

    renderer.render(
        scene,
        camera
    );
}

animate();

</script>
</body>
</html>
