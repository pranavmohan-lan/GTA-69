<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Open World</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#82c9f2}
canvas{display:block}
#hud{
 position:fixed;top:12px;left:12px;z-index:5;
 padding:10px 13px;border-radius:12px;
 background:rgba(0,0,0,.45);backdrop-filter:blur(8px);
 color:white;font:13px Arial
}
#cross{
 position:fixed;left:50%;top:50%;z-index:5;
 width:5px;height:5px;background:white;border-radius:50%;
 box-shadow:0 0 8px white;transform:translate(-50%,-50%)
}
#start{
 position:fixed;inset:0;z-index:20;
 display:flex;align-items:center;justify-content:center;
 background:linear-gradient(#64b7e855,#1d405955);
 color:white;font:700 24px Arial;
 cursor:pointer
}
#start span{
 padding:16px 28px;border-radius:15px;
 background:#111c;box-shadow:0 10px 40px #0008
}
</style>
</head>
<body>

<div id="start"><span>CLICK TO PLAY</span></div>

<div id="hud">
<b>MINI CITY</b><br>
WASD / ARROWS — MOVE<br>
E — ENTER CAR<br>
MOUSE — LOOK
</div>

<div id="cross"></div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================
   ENGINE
========================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x82c9f2);

scene.fog=new THREE.Fog(
0x82c9f2,
250,
850
);

const camera=new THREE.PerspectiveCamera(
65,
innerWidth/innerHeight,
.1,
1000
);

const renderer=new THREE.WebGLRenderer({
antialias:false,
powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.15));

renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);

/* =========================
   LIGHTING
========================= */

const hemi=new THREE.HemisphereLight(
0xccecff,
0x496044,
2.2
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
0xffe4b5,
3.5
);

sun.position.set(-180,300,150);
sun.castShadow=true;

sun.shadow.mapSize.set(768,768);

sun.shadow.camera.left=-250;
sun.shadow.camera.right=250;
sun.shadow.camera.top=250;
sun.shadow.camera.bottom=-250;

sun.shadow.camera.far=700;

scene.add(sun);

/* =========================
   MATERIALS
========================= */

const grass=new THREE.MeshStandardMaterial({
color:0x4d8b4c,
roughness:1
});

const road=new THREE.MeshStandardMaterial({
color:0x202326,
roughness:.92
});

const sidewalk=new THREE.MeshStandardMaterial({
color:0x777979,
roughness:.9
});

const building=new THREE.MeshStandardMaterial({
color:0xaaa9a5,
roughness:.85
});

const glass=new THREE.MeshStandardMaterial({
color:0x163e56,
metalness:.55,
roughness:.18
});

const skin=new THREE.MeshStandardMaterial({
color:0xc88b69,
roughness:.8
});

const shirt=new THREE.MeshStandardMaterial({
color:0x254a9a,
roughness:.8
});

const pants=new THREE.MeshStandardMaterial({
color:0x202124,
roughness:.9
});

const tire=new THREE.MeshStandardMaterial({
color:0x101010,
roughness:1
});

/* =========================
   GROUND
========================= */

const ground=new THREE.Mesh(
new THREE.PlaneGeometry(1000,1000),
grass
);

ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;

scene.add(ground);

/* =========================
   ROADS
========================= */

const roadStep=140;

for(let i=-420;i<=420;i+=roadStep){

const r1=new THREE.Mesh(
new THREE.BoxGeometry(28,.08,1000),
road
);

r1.position.set(i,.04,0);
r1.receiveShadow=true;
scene.add(r1);

const r2=new THREE.Mesh(
new THREE.BoxGeometry(1000,.08,28),
road
);

r2.position.set(0,.04,i);
r2.receiveShadow=true;
scene.add(r2);
}

/* =========================
   ROAD LINES
========================= */

const lineMat=new THREE.MeshBasicMaterial({
color:0xf3e3a1
});

for(let i=-420;i<=420;i+=roadStep){

for(let j=-480;j<480;j+=28){

const a=new THREE.Mesh(
new THREE.BoxGeometry(1,.09,13),
lineMat
);

a.position.set(i,.1,j);
scene.add(a);

const b=new THREE.Mesh(
new THREE.BoxGeometry(13,.09,1),
lineMat
);

b.position.set(j,.1,i);
scene.add(b);

}
}

/* =========================
   BUILDINGS — LOW COUNT
========================= */

const geo=new THREE.BoxGeometry(1,1,1);

const buildings=new THREE.InstancedMesh(
geo,
building,
55
);

buildings.castShadow=true;
buildings.receiveShadow=true;

const dummy=new THREE.Object3D();

let bi=0;

for(let x=-420;x<=420;x+=roadStep){

for(let z=-420;z<=420;z+=roadStep){

if(bi>=55)break;

if(Math.random()<.35)continue;

const w=35+Math.random()*35;
const d=35+Math.random()*35;
const h=25+Math.random()*70;

dummy.position.set(
x+(Math.random()-.5)*65,
h/2,
z+(Math.random()-.5)*65
);

dummy.scale.set(w,h,d);

dummy.updateMatrix();

buildings.setMatrixAt(bi++,dummy.matrix);
}

if(bi>=55)break;
}

buildings.instanceMatrix.needsUpdate=true;
scene.add(buildings);

/* =========================
   SIMPLE TREES
========================= */

const trunkMat=new THREE.MeshStandardMaterial({
color:0x5b3822
});

const leafMat=new THREE.MeshStandardMaterial({
color:0x27703a,
roughness:1
});

const trunkGeo=new THREE.CylinderGeometry(.35,.5,4,7);
const leafGeo=new THREE.SphereGeometry(2.8,7,6);

const trunks=new THREE.InstancedMesh(
trunkGeo,trunkMat,35
);

const leaves=new THREE.InstancedMesh(
leafGeo,leafMat,35
);

for(let i=0;i<35;i++){

const x=(Math.random()-.5)*850;
const z=(Math.random()-.5)*850;

dummy.position.set(x,2,z);
dummy.scale.set(1,1,1);
dummy.updateMatrix();

trunks.setMatrixAt(i,dummy.matrix);

dummy.position.set(x,5,z);
dummy.scale.setScalar(.8+Math.random()*.5);
dummy.updateMatrix();

leaves.setMatrixAt(i,dummy.matrix);
}

trunks.instanceMatrix.needsUpdate=true;
leaves.instanceMatrix.needsUpdate=true;

trunks.castShadow=true;
leaves.castShadow=true;

scene.add(trunks,leaves);

/* =========================
   HUMAN
========================= */

function human(x,z){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.CapsuleGeometry(.38,.85,4,7),
shirt
);

body.position.y=1.35;
body.castShadow=true;

const head=new THREE.Mesh(
new THREE.SphereGeometry(.35,10,8),
skin
);

head.position.y=2.25;
head.castShadow=true;

const legGeo=new THREE.CapsuleGeometry(
.15,.72,3,6
);

const l1=new THREE.Mesh(legGeo,pants);
const l2=new THREE.Mesh(legGeo,pants);

l1.position.set(-.19,.52,0);
l2.position.set(.19,.52,0);

l1.castShadow=true;
l2.castShadow=true;

const armGeo=new THREE.CapsuleGeometry(
.11,.65,3,6
);

const a1=new THREE.Mesh(armGeo,shirt);
const a2=new THREE.Mesh(armGeo,shirt);

a1.position.set(-.48,1.38,0);
a2.position.set(.48,1.38,0);

a1.castShadow=true;
a2.castShadow=true;

g.add(body,head,l1,l2,a1,a2);

g.position.set(x,0,z);

scene.add(g);

return{
g,l1,l2,a1,a2,
speed:.5+Math.random()
};
}

/* PLAYER */

const player=human(0,55);

/* PEOPLE */

const people=[];

for(let i=0;i<12;i++){

const p=human(
(Math.random()-.5)*700,
(Math.random()-.5)*700
);

people.push(p);
}

/* =========================
   CAR
========================= */

function car(x,z,color){

const g=new THREE.Group();

const body=new THREE.Mesh(
new THREE.BoxGeometry(4,1,7),
new THREE.MeshStandardMaterial({
color,
metalness:.65,
roughness:.25
})
);

body.position.y=.9;
body.castShadow=true;

const cabin=new THREE.Mesh(
new THREE.BoxGeometry(3.2,1,3.1),
glass
);

cabin.position.set(0,1.65,-.25);
cabin.castShadow=true;

const wheelGeo=new THREE.CylinderGeometry(
.65,.65,.35,10
);

for(const xx of [-1.75,1.75]){

for(const zz of [-2.2,2.2]){

const w=new THREE.Mesh(
wheelGeo,
tire
);

w.rotation.z=Math.PI/2;
w.position.set(xx,.65,zz);
w.castShadow=true;

g.add(w);
}
}

g.add(body,cabin);

g.position.set(x,.05,z);

scene.add(g);

return{
g,
speed:20+Math.random()*12,
horizontal:Math.random()>.5
};
}

/* PLAYER CAR */

const playerCar=car(0,25,0x174dba);

let driving=false;

/* TRAFFIC */

const traffic=[];

for(let i=0;i<8;i++){

const horizontal=Math.random()>.5;

const c=car(
horizontal?
(Math.random()-.5)*750:
Math.round((Math.random()*6-3))*roadStep,

horizontal?
Math.round((Math.random()*6-3))*roadStep:
(Math.random()-.5)*750,

Math.random()>.5?0xb41e26:0xeeeeee
);

c.horizontal=horizontal;

traffic.push(c);
}

/* =========================
   CONTROLS
========================= */

const keys={};

addEventListener("keydown",e=>{

keys[e.key.toLowerCase()]=true;

if(e.key.toLowerCase()==="e")
toggleCar();

});

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
});

/* =========================
   MOUSE
========================= */

let yaw=0;

document.addEventListener("mousemove",e=>{

if(document.pointerLockElement!==document.body)return;

yaw-=e.movementX*.0025;

});

/* =========================
   START
========================= */

document.getElementById("start").onclick=()=>{

document.getElementById("start").style.display="none";

document.body.requestPointerLock();

};

/* =========================
   ENTER CAR
========================= */

function toggleCar(){

const dx=player.g.position.x-playerCar.g.position.x;
const dz=player.g.position.z-playerCar.g.position.z;

if(!driving && Math.hypot(dx,dz)<8){

driving=true;
player.g.visible=false;

playerCar.g.position.copy(player.g.position);

}

else if(driving){

driving=false;
player.g.visible=true;

player.g.position.copy(playerCar.g.position);
player.g.position.x+=5;

}

}

/* =========================
   MOVEMENT
========================= */

function updatePlayer(dt){

if(driving){

let throttle=0;

if(keys.w||keys.arrowup)throttle=1;
if(keys.s||keys.arrowdown)throttle=-1;

playerCar.speed+=throttle*35*dt;

playerCar.speed*=.96;

playerCar.speed=
Math.max(-15,Math.min(65,playerCar.speed));

let steer=0;

if(keys.a||keys.arrowleft)steer=1;
if(keys.d||keys.arrowright)steer=-1;

playerCar.g.rotation.y+=
steer*playerCar.speed*.018*dt;

const f=new THREE.Vector3(
Math.sin(playerCar.g.rotation.y),
0,
Math.cos(playerCar.g.rotation.y)
);

playerCar.g.position.addScaledVector(
f,
playerCar.speed*dt
);

}

else{

let x=0,z=0;

if(keys.w||keys.arrowup)z=-1;
if(keys.s||keys.arrowdown)z=1;
if(keys.a||keys.arrowleft)x=-1;
if(keys.d||keys.arrowright)x=1;

if(x||z){

const l=Math.hypot(x,z);
x/=l;
z/=l;

const s=Math.sin(yaw);
const c=Math.cos(yaw);

player.g.position.x+=
(x*c-z*s)*8*dt;

player.g.position.z+=
(x*s+z*c)*8*dt;

}

player.g.rotation.y=yaw;
}

}

/* =========================
   PEOPLE
========================= */

let walkTime=0;

function updatePeople(dt){

walkTime+=dt*8;

for(let i=0;i<people.length;i++){

const p=people[i];

p.g.position.x+=
Math.sin(p.g.rotation.y)*p.speed*dt;

p.g.position.z+=
Math.cos(p.g.rotation.y)*p.speed*dt;

if(Math.random()<.003)
p.g.rotation.y+=(Math.random()-.5)*2;

p.l1.rotation.x=Math.sin(walkTime+i)*.45;
p.l2.rotation.x=-Math.sin(walkTime+i)*.45;

p.a1.rotation.x=-Math.sin(walkTime+i)*.3;
p.a2.rotation.x=Math.sin(walkTime+i)*.3;

if(Math.abs(p.g.position.x)>480)
p.g.position.x*=-.9;

if(Math.abs(p.g.position.z)>480)
p.g.position.z*=-.9;
}

if(!driving){

const moving=
keys.w||keys.a||keys.s||keys.d||
keys.arrowup||keys.arrowdown||
keys.arrowleft||keys.arrowright;

if(moving){

player.l1.rotation.x=Math.sin(walkTime)*.65;
player.l2.rotation.x=-Math.sin(walkTime)*.65;

player.a1.rotation.x=-Math.sin(walkTime)*.4;
player.a2.rotation.x=Math.sin(walkTime)*.4;

}else{

player.l1.rotation.x*=.8;
player.l2.rotation.x*=.8;
player.a1.rotation.x*=.8;
player.a2.rotation.x*=.8;

}

}

}

/* =========================
   TRAFFIC
========================= */

function updateTraffic(dt){

for(const c of traffic){

if(c.horizontal){

c.g.position.x+=c.speed*dt;

if(c.g.position.x>520)
c.g.position.x=-520;

}else{

c.g.position.z+=c.speed*dt;

if(c.g.position.z>520)
c.g.position.z=-520;

}

}

}

/* =========================
   CAMERA
========================= */

const target=new THREE.Vector3();

function cameraUpdate(){

if(driving){

const p=playerCar.g.position;

const back=new THREE.Vector3(
Math.sin(playerCar.g.rotation.y),
0,
Math.cos(playerCar.g.rotation.y)
);

camera.position.lerp(
new THREE.Vector3(
p.x-back.x*11,
p.y+4.5,
p.z-back.z*11
),
.13
);

target.set(
p.x,
p.y+1.2,
p.z
);

}else{

const p=player.g.position;

const back=new THREE.Vector3(
Math.sin(yaw),
0,
Math.cos(yaw)
);

camera.position.lerp(
new THREE.Vector3(
p.x+back.x*6.5,
p.y+3,
p.z+back.z*6.5
),
.14
);

target.set(
p.x,
p.y+1.25,
p.z
);

}

camera.lookAt(target);

}

/* =========================
   ANIMATION
========================= */

const clock=new THREE.Clock();

function loop(){

requestAnimationFrame(loop);

const dt=Math.min(
clock.getDelta(),
.033
);

updatePlayer(dt);
updatePeople(dt);
updateTraffic(dt);
cameraUpdate();

renderer.render(scene,camera);

}

loop();

/* =========================
   RESIZE
========================= */

addEventListener("resize",()=>{

camera.aspect=innerWidth/innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(innerWidth,innerHeight);

});

</script>
</body>
</html>
